name: Feature request
description: Suggest an idea for Boris
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Focus on the problem you're trying to solve — that helps more than a specific UI sketch.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is this for, and what are they stuck on today?
      placeholder: I want to… but currently I have to…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like Boris to help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've tried or thought about.
    validations:
      required: false
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Mockups, links, or related issues.
    validations:
      required: false
