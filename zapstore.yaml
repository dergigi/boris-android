name: Boris
summary: A calm Android reader for web articles
description: |
  Boris takes a web URL and shows a readable article. Paste a link, share one
  from the browser, or open an http(s) URL with the app.

  Article text comes from r.jina.ai, the same path the Boris webapp uses.
  In-article links stay in the reader. If a page cannot be parsed, open the
  original in whatever app handles that URL.

  No accounts. No Nostr. Just reading.
